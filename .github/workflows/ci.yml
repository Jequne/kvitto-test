name: CI

on: push

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Pytest
        run: uv run --locked pytest -q
