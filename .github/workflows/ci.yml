name: CI

on: push

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Pytest
        run: uv run --locked pytest -q
